<!doctype html>
<html lang="zh-TW" class="h-full">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>班別設定</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
  <style>
    * { font-family: 'Noto Sans TC', sans-serif; }
    html, body { height: 100%; width: 100%; }
  </style>
 </head>
 <body class="h-full bg-slate-50 w-full">
  <div class="h-full w-full flex flex-col overflow-auto">
   <header class="bg-[#1e3a5f] text-white px-6 py-4 flex items-center justify-between shrink-0">
    <h1 id="pageTitle" class="text-xl font-bold tracking-wide">新增班別</h1>
    <button onclick="goBack()" class="px-4 py-1.5 rounded-md text-sm font-medium transition hover:bg-white/10">返回班表設定</button>
   </header>

   <main class="flex-1 overflow-auto p-6">
    <div class="max-w-3xl mx-auto">
      <section class="bg-white rounded-xl shadow-sm p-5 space-y-4">
        <h2 id="formTitle" class="font-bold text-lg text-slate-800">班別資訊</h2>

        <div>
          <label class="block text-sm font-medium text-slate-600 mb-1">班別名稱</label>
          <input type="text" id="shiftName" placeholder="如：早班" class="w-full border border-slate-300 rounded-md px-3 py-2 text-sm">
        </div>

        <div>
          <label class="block text-sm font-medium text-slate-600 mb-1">班別簡稱</label>
          <input type="text" id="shiftShortName" placeholder="如：早" maxlength="4" class="w-full border border-slate-300 rounded-md px-3 py-2 text-sm">
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
          <div>
            <label class="block text-sm font-medium text-slate-600 mb-1">分公司/分店/案場</label>
            <select id="scopeBranchSelect" class="w-full border border-slate-300 rounded-md px-3 py-2 text-sm"></select>
          </div>
          <div>
            <label class="block text-sm font-medium text-slate-600 mb-1">部門/工作地</label>
            <select id="scopeDepartmentSelect" class="w-full border border-slate-300 rounded-md px-3 py-2 text-sm"></select>
          </div>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-sm font-medium text-slate-600 mb-1">起始</label>
            <input type="time" id="shiftStart" value="08:00" class="w-full border border-slate-300 rounded-md px-3 py-2 text-sm" oninput="onShiftTimeChange()">
          </div>
          <div>
            <label class="block text-sm font-medium text-slate-600 mb-1">結束</label>
            <input type="time" id="shiftEnd" value="12:00" class="w-full border border-slate-300 rounded-md px-3 py-2 text-sm" oninput="onShiftTimeChange()">
          </div>
        </div>

        <label class="flex items-center gap-2 text-sm text-slate-700 cursor-pointer">
          <input type="checkbox" id="shiftCrossDay" onchange="onShiftTimeChange()">
          <span>允許跨天（例如：22:00 ~ 06:00）</span>
        </label>

        <div class="space-y-3 border-t border-slate-200 pt-4">
          <label class="block text-sm font-medium text-slate-600">休息設定</label>
          <label class="flex items-center gap-2 text-sm text-slate-700 cursor-pointer">
            <input type="checkbox" id="shiftHasRest" onchange="updateShiftRestUI(); updateShiftHoursPreview()">
            <span>有休息時間</span>
          </label>
          <div id="shiftRestConfig" class="space-y-3 pl-6">
            <div class="flex items-center gap-4 text-sm text-slate-700">
              <label class="flex items-center gap-2 cursor-pointer"><input type="radio" name="shiftRestType" id="shiftRestTypeFixed" value="fixed" onchange="updateShiftRestUI(); updateShiftHoursPreview()">固定</label>
              <label class="flex items-center gap-2 cursor-pointer"><input type="radio" name="shiftRestType" id="shiftRestTypeFlexible" value="flexible" onchange="updateShiftRestUI(); updateShiftHoursPreview()">非固定</label>
            </div>
            <div id="shiftRestFixedFields" class="grid grid-cols-2 gap-3">
              <div>
                <label class="block text-sm font-medium text-slate-600 mb-1">開始時間</label>
                <input type="time" id="shiftRestStart" value="12:00" class="w-full border border-slate-300 rounded-md px-3 py-2 text-sm" oninput="updateShiftHoursPreview()">
              </div>
              <div>
                <label class="block text-sm font-medium text-slate-600 mb-1">結束時間</label>
                <input type="time" id="shiftRestEnd" value="13:00" class="w-full border border-slate-300 rounded-md px-3 py-2 text-sm" oninput="updateShiftHoursPreview()">
              </div>
            </div>
            <div id="shiftRestFlexibleFields" class="hidden">
              <label class="block text-sm font-medium text-slate-600 mb-1">休息時數</label>
              <div class="flex items-center gap-2">
                <input type="number" id="shiftRestMinutes" min="0" max="480" step="30" value="60" class="w-32 border border-slate-300 rounded-md px-3 py-2 text-sm" oninput="updateShiftHoursPreview()">
                <span class="text-sm text-slate-600">分鐘</span>
              </div>
            </div>
            <p class="text-xs text-slate-500">休息時間不會列入上班時數中。</p>
          </div>
          <p class="text-xs text-slate-500">勞基法：每繼續工作 4 小時至少休息 30 分鐘（僅工作 4 小時可免）。</p>
          <p class="text-xs text-slate-500">總工時 = 結束 - 起始 - 休息；預覽：<span id="shiftHoursPreview" class="font-medium text-amber-700">0h</span>、最低法定休息：<span id="shiftMinRest" class="font-medium text-orange-700">0h</span></p>
        </div>

        <div class="border-t border-slate-200 pt-4 mt-4 space-y-4">
          <label class="block text-sm font-medium text-slate-600 flex items-center gap-2"><i data-lucide="timer" class="w-4 h-4 text-orange-600"></i>加班設置</label>
          <label class="flex items-center gap-2 text-sm text-slate-700 cursor-pointer">
            <input type="checkbox" id="shiftAutoCountOvertime" onchange="updateShiftOvertimeUI()">
            <span>系統自動統計加班時數</span>
          </label>
          <div id="shiftOvertimeRules" class="space-y-4 rounded-xl border border-slate-200 p-4">
            <label class="flex items-center gap-2 text-sm text-slate-700 cursor-pointer">
              <input type="checkbox" id="shiftCountEarlyArrivalAsOvertime" onchange="updateShiftOvertimeUI()">
              <span>比上班時間早到，自動設為加班</span>
            </label>
            <div class="border-t border-slate-200"></div>
            <label class="flex items-center gap-2 text-sm text-slate-700 cursor-pointer">
              <input type="checkbox" id="shiftCountLateDepartureAsOvertime" onchange="updateShiftOvertimeUI()">
              <span>比下班時間晚退，自動設為加班</span>
            </label>
            <div id="shiftOvertimeDetailFields" class="space-y-5 pl-9">
              <div>
                <label class="block text-sm font-medium text-slate-600 mb-1">最短加班時間</label>
                <div class="flex items-center gap-2">
                  <input type="number" id="shiftMinOvertimeMinutes" min="0" max="720" step="1" value="30" class="w-32 border border-slate-300 rounded-md px-3 py-2 text-sm">
                  <span class="text-sm text-slate-600">分鐘</span>
                </div>
              </div>
              <div>
                <label class="block text-sm font-medium text-slate-600 mb-1">最長加班時間</label>
                <div class="flex items-center gap-2">
                  <input type="number" id="shiftMaxOvertimeMinutes" min="0" max="720" step="1" value="360" class="w-32 border border-slate-300 rounded-md px-3 py-2 text-sm">
                  <span class="text-sm text-slate-600">分鐘</span>
                </div>
              </div>
              <div>
                <label class="block text-sm font-medium text-slate-600 mb-1">加班前的休息時間</label>
                <div class="flex items-center gap-2">
                  <input type="number" id="shiftRestBeforeOvertimeMinutes" min="0" max="240" step="1" value="30" class="w-32 border border-slate-300 rounded-md px-3 py-2 text-sm">
                  <span class="text-sm text-slate-600">分鐘</span>
                </div>
              </div>
            </div>
          </div>
        </div>

        <div class="border-t border-slate-200 pt-4 mt-4">
          <label class="block text-sm font-medium text-slate-600 mb-3 flex items-center gap-2"><i data-lucide="alarm-clock" class="w-4 h-4 text-sky-600"></i>可打卡時段（班表開始）</label>
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-sm font-medium text-slate-600 mb-1">開始前（分鐘）</label>
              <input type="number" id="shiftPunchBeforeMinutes" min="0" max="180" step="1" value="30" class="w-full border border-slate-300 rounded-md px-3 py-2 text-sm">
            </div>
            <div>
              <label class="block text-sm font-medium text-slate-600 mb-1">開始後（分鐘）</label>
              <input type="number" id="shiftPunchAfterMinutes" min="0" max="720" step="1" value="30" class="w-full border border-slate-300 rounded-md px-3 py-2 text-sm">
            </div>
          </div>
          <p class="text-xs text-slate-500 mt-1">可在班表開始前/後指定分鐘內打卡；下班卡極限為 12 小時（含工作時段）。</p>
        </div>

        <div class="flex justify-end gap-2 pt-2">
          <button onclick="goBack()" class="px-4 py-2 text-sm text-slate-600 hover:bg-slate-100 rounded-md">取消</button>
          <button id="saveBtn" onclick="saveShift()" class="px-4 py-2 text-sm bg-[#1e3a5f] text-white rounded-md hover:bg-[#2a4f7f]">儲存</button>
        </div>
      </section>
    </div>
   </main>
  </div>

  <script>
  const DRAFT_KEY = 'shiftMgmt:newScheduleDraft';
  const CHOOSE_LIBRARY_KEY = 'shiftMgmt:chooseLibrary';
  const PUNCH_BEFORE_MAX_MINUTES = 180;
  const PUNCH_AFTER_MAX_MINUTES = 720;

  const FALLBACK = {
    shifts: [
      { name: '早班', shortName: '早', start: '08:00', end: '17:00', crossDay: false, hours: 8, hasRest: true, restType: 'fixed', restStart: '12:00', restEnd: '13:00', restMinutes: 60, rest: 1, autoCountOvertime: false, countEarlyArrivalAsOvertime: false, countLateDepartureAsOvertime: false, minOvertimeMinutes: 30, maxOvertimeMinutes: 360, restBeforeOvertimeMinutes: 30, otStart: '', otEnd: '', punchBeforeMinutes: 30, punchAfterMinutes: 30 },
      { name: '午班', shortName: '午', start: '13:00', end: '17:00', crossDay: false, hours: 4, hasRest: false, restType: 'fixed', restStart: '15:00', restEnd: '15:30', restMinutes: 0, rest: 0, autoCountOvertime: false, countEarlyArrivalAsOvertime: false, countLateDepartureAsOvertime: false, minOvertimeMinutes: 30, maxOvertimeMinutes: 360, restBeforeOvertimeMinutes: 30, otStart: '', otEnd: '', punchBeforeMinutes: 30, punchAfterMinutes: 30 },
      { name: '晚班', shortName: '晚', start: '18:00', end: '22:00', crossDay: false, hours: 4, hasRest: false, restType: 'fixed', restStart: '20:00', restEnd: '20:30', restMinutes: 0, rest: 0, autoCountOvertime: true, countEarlyArrivalAsOvertime: false, countLateDepartureAsOvertime: true, minOvertimeMinutes: 0, maxOvertimeMinutes: 60, restBeforeOvertimeMinutes: 30, otStart: '22:00', otEnd: '23:00', punchBeforeMinutes: 30, punchAfterMinutes: 30 }
    ],
    attendanceGroups: [],
    schedules: [{ shifts: [], attendanceGroups: [] }]
  };

  let G = FALLBACK;
  try {
    const raw = localStorage.getItem('shiftMgmt:global');
    if (raw) G = Object.assign({}, FALLBACK, JSON.parse(raw));
  } catch (e) { console.warn('load global failed', e); }

  const params = new URLSearchParams(location.search);
  const source = params.get('source') === 'new' ? 'new' : 'edit';
  const mode = params.get('mode') === 'library' ? 'library' : 'schedule';
  const shiftIndexParam = parseInt(params.get('shiftIndex'), 10);
  const editingShiftIndex = Number.isInteger(shiftIndexParam) && shiftIndexParam >= 0 ? shiftIndexParam : -1;
  let currentScheduleIndex = parseInt(params.get('index'), 10);
    const returnTo = params.get('returnTo') || '';
  if (Number.isNaN(currentScheduleIndex)) currentScheduleIndex = 0;

  let schedules = Array.isArray(G.schedules) && G.schedules.length ? G.schedules : FALLBACK.schedules;
  if (currentScheduleIndex < 0 || currentScheduleIndex >= schedules.length) currentScheduleIndex = 0;

  let draft = null;
  let chooseLibrary = { shifts: [], attendanceGroups: [] };
  if (source === 'new') {
    try {
      const rawDraft = localStorage.getItem(DRAFT_KEY);
      if (rawDraft) draft = JSON.parse(rawDraft);
    } catch (e) { console.warn('load draft failed', e); }
  } else if (mode === 'library') {
    try {
      const rawLibrary = localStorage.getItem(CHOOSE_LIBRARY_KEY);
      if (rawLibrary) {
        chooseLibrary = Object.assign({}, chooseLibrary, JSON.parse(rawLibrary));
      } else {
        chooseLibrary = {
          shifts: Array.isArray(G.shifts) ? JSON.parse(JSON.stringify(G.shifts)) : [],
          attendanceGroups: Array.isArray(G.attendanceGroups) ? JSON.parse(JSON.stringify(G.attendanceGroups)) : []
        };
      }
    } catch (e) {
      console.warn('load choose library failed', e);
    }
  }

  const sched = source === 'new'
    ? (draft || { shifts: Array.isArray(G.shifts) ? G.shifts : FALLBACK.shifts, attendanceGroups: Array.isArray(G.attendanceGroups) ? G.attendanceGroups : [] })
    : (mode === 'library'
      ? { shifts: Array.isArray(chooseLibrary.shifts) ? chooseLibrary.shifts : [], attendanceGroups: Array.isArray(chooseLibrary.attendanceGroups) ? chooseLibrary.attendanceGroups : [] }
      : (schedules[currentScheduleIndex] || FALLBACK.schedules[0]));

  let shifts = Array.isArray(sched.shifts) ? JSON.parse(JSON.stringify(sched.shifts)) : [];
  let attendanceGroups = Array.isArray(sched.attendanceGroups) ? JSON.parse(JSON.stringify(sched.attendanceGroups)) : [];

  function splitScopeValues(raw) {
    return String(raw || '')
      .split(/[\/,，、；;｜|\s]+/)
      .map(v => v.trim())
      .filter(Boolean);
  }

  function pickScopeArray(existing, fallbackRaw) {
    if (Array.isArray(existing) && existing.length) {
      return Array.from(new Set(existing.map(v => String(v || '').trim()).filter(Boolean)));
    }
    return Array.from(new Set(splitScopeValues(fallbackRaw)));
  }

  function buildScopeOptions(globalList, scheduleRaw, existingRaw) {
    const all = new Set();
    if (Array.isArray(globalList)) {
      globalList.forEach(item => splitScopeValues(item).forEach(v => all.add(v)));
    }
    splitScopeValues(scheduleRaw).forEach(v => all.add(v));
    splitScopeValues(existingRaw).forEach(v => all.add(v));
    return Array.from(all).filter(Boolean).sort((a, b) => a.localeCompare(b, 'zh-Hant'));
  }

  function renderScopeSelectors(existing = null) {
    const branchSelect = document.getElementById('scopeBranchSelect');
    const departmentSelect = document.getElementById('scopeDepartmentSelect');
    if (!branchSelect || !departmentSelect) return;

    const scheduleBranch = sched && sched.branch ? sched.branch : '';
    const scheduleDepartment = sched && sched.department ? sched.department : '';
    const currentBranch = existing && existing.branch ? existing.branch : '';
    const currentDepartment = existing && existing.department ? existing.department : '';

    const branchOptions = buildScopeOptions(G.branches, scheduleBranch, currentBranch);
    const departmentOptions = buildScopeOptions(G.departments, scheduleDepartment, currentDepartment);

    branchSelect.innerHTML = `<option value="">未指定</option>` + branchOptions.map(v => `<option value="${v}">${v}</option>`).join('');
    departmentSelect.innerHTML = `<option value="">未指定</option>` + departmentOptions.map(v => `<option value="${v}">${v}</option>`).join('');
    branchSelect.value = currentBranch;
    departmentSelect.value = currentDepartment;
    if (branchSelect.value !== currentBranch) branchSelect.value = '';
    if (departmentSelect.value !== currentDepartment) departmentSelect.value = '';
  }

  function buildScopeFields(existing = null) {
    const scheduleBranch = sched && sched.branch ? sched.branch : '';
    const scheduleDepartment = sched && sched.department ? sched.department : '';
    const selectedBranch = (document.getElementById('scopeBranchSelect')?.value || '').trim();
    const selectedDepartment = (document.getElementById('scopeDepartmentSelect')?.value || '').trim();
    const hasScopeInputs = !!document.getElementById('scopeBranchSelect') && !!document.getElementById('scopeDepartmentSelect');
    const branches = hasScopeInputs
      ? (selectedBranch ? [selectedBranch] : [])
      : pickScopeArray(existing && existing.branches, existing && existing.branch ? existing.branch : scheduleBranch);
    const departments = hasScopeInputs
      ? (selectedDepartment ? [selectedDepartment] : [])
      : pickScopeArray(existing && existing.departments, existing && existing.department ? existing.department : scheduleDepartment);
    return {
      branch: branches[0] || '',
      branches,
      department: departments[0] || '',
      departments
    };
  }

  function normalizePunchWindowMinutes(value, fallback = 30, max = PUNCH_BEFORE_MAX_MINUTES) {
    const parsed = Number.parseInt(String(value), 10);
    if (Number.isNaN(parsed)) return fallback;
    return Math.max(0, Math.min(max, parsed));
  }

  function normalizeOvertimeMinutes(value, fallback, max = 720) {
    const parsed = Number.parseInt(String(value), 10);
    if (Number.isNaN(parsed)) return fallback;
    return Math.max(0, Math.min(max, parsed));
  }

  function normalizeRestMinutes(value, fallback = 0, max = 480) {
    const parsed = Number.parseInt(String(value), 10);
    if (Number.isNaN(parsed)) return fallback;
    return Math.max(0, Math.min(max, parsed));
  }

  function timeToMinutes(value) {
    if (!value || typeof value !== 'string' || !value.includes(':')) return null;
    const [hours, minutes] = value.split(':').map(Number);
    if (Number.isNaN(hours) || Number.isNaN(minutes)) return null;
    return hours * 60 + minutes;
  }

  function addMinutesToTime(value, deltaMinutes) {
    const base = timeToMinutes(value);
    if (base == null) return '';
    const dayMinutes = 24 * 60;
    const normalized = ((base + deltaMinutes) % dayMinutes + dayMinutes) % dayMinutes;
    const hours = String(Math.floor(normalized / 60)).padStart(2, '0');
    const minutes = String(normalized % 60).padStart(2, '0');
    return `${hours}:${minutes}`;
  }

  function calcDurationHours(start, end, crossDay = false) {
    if (!start || !end) return 0;
    const [sh, sm] = start.split(':').map(Number);
    const [eh, em] = end.split(':').map(Number);
    let diffMinutes = (eh * 60 + em) - (sh * 60 + sm);
    if (crossDay && diffMinutes <= 0) diffMinutes += 24 * 60;
    return Math.max(0, diffMinutes / 60);
  }

  function calcTimeRangeMinutes(start, end, crossDay = false) {
    if (!start || !end) return 0;
    const [sh, sm] = start.split(':').map(Number);
    const [eh, em] = end.split(':').map(Number);
    let diffMinutes = (eh * 60 + em) - (sh * 60 + sm);
    if (crossDay && diffMinutes <= 0) diffMinutes += 24 * 60;
    return Math.max(0, diffMinutes);
  }

  function calcWorkHours(start, end, rest, crossDay = false) {
    return Math.max(0, calcDurationHours(start, end, crossDay) - (Number(rest) || 0));
  }

  function minRequiredRest(durationHours) {
    if (durationHours <= 4) return 0;
    return Math.floor((durationHours - 0.0001) / 4) * 0.5;
  }

  function diffMinutesFromBase(baseTime, targetTime) {
    const base = timeToMinutes(baseTime);
    const target = timeToMinutes(targetTime);
    if (base == null || target == null) return null;
    return target >= base ? (target - base) : ((24 * 60 - base) + target);
  }

  function normalizeShiftRestSettings(shift = {}) {
    const restHours = Number(shift.rest) || 0;
    const fallbackMinutes = Math.round(restHours * 60);
    const hasRest = typeof shift.hasRest === 'boolean' ? shift.hasRest : restHours > 0;
    const restType = shift.restType === 'fixed' ? 'fixed' : 'flexible';
    const restMinutes = normalizeRestMinutes(shift.restMinutes, fallbackMinutes, 480);
    const restStart = shift.restStart || '12:00';
    const restEnd = shift.restEnd || addMinutesToTime(restStart, restMinutes || 60);
    const fixedMinutes = calcTimeRangeMinutes(restStart, restEnd, !!shift.crossDay && restEnd <= restStart);
    const finalMinutes = hasRest ? (restType === 'fixed' ? (fixedMinutes || restMinutes || 60) : (restMinutes || 60)) : 0;
    return {
      hasRest,
      restType,
      restStart,
      restEnd,
      restMinutes: finalMinutes,
      rest: finalMinutes / 60
    };
  }

  function normalizeShiftOvertimeSettings(shift = {}) {
    const hasLegacyOvertime = !!((shift && shift.otStart) || (shift && shift.otEnd));
    const legacyMinMinutes = diffMinutesFromBase(shift && shift.end, shift && shift.otStart);
    const legacyMaxMinutes = diffMinutesFromBase(shift && shift.end, shift && shift.otEnd);
    const autoCountOvertime = typeof shift.autoCountOvertime === 'boolean' ? shift.autoCountOvertime : hasLegacyOvertime;
    const countEarlyArrivalAsOvertime = !!shift.countEarlyArrivalAsOvertime;
    const countLateDepartureAsOvertime = typeof shift.countLateDepartureAsOvertime === 'boolean' ? shift.countLateDepartureAsOvertime : hasLegacyOvertime;
    const minOvertimeMinutes = normalizeOvertimeMinutes(shift.minOvertimeMinutes, legacyMinMinutes != null ? legacyMinMinutes : 30, 720);
    const maxOvertimeMinutes = Math.max(normalizeOvertimeMinutes(shift.maxOvertimeMinutes, legacyMaxMinutes != null ? Math.max(legacyMaxMinutes, minOvertimeMinutes) : 360, 720), minOvertimeMinutes);
    return {
      autoCountOvertime,
      countEarlyArrivalAsOvertime,
      countLateDepartureAsOvertime,
      minOvertimeMinutes,
      maxOvertimeMinutes,
      restBeforeOvertimeMinutes: normalizeOvertimeMinutes(shift.restBeforeOvertimeMinutes, 30, 240)
    };
  }

  function applyShiftRestFields(shift = {}) {
    const rest = normalizeShiftRestSettings(shift);
    document.getElementById('shiftHasRest').checked = rest.hasRest;
    document.getElementById('shiftRestTypeFixed').checked = rest.restType === 'fixed';
    document.getElementById('shiftRestTypeFlexible').checked = rest.restType !== 'fixed';
    document.getElementById('shiftRestStart').value = rest.restStart;
    document.getElementById('shiftRestEnd').value = rest.restEnd;
    document.getElementById('shiftRestMinutes').value = rest.restMinutes || 60;
    updateShiftRestUI();
  }

  function readShiftRestFields() {
    const hasRest = !!document.getElementById('shiftHasRest').checked;
    const restType = document.getElementById('shiftRestTypeFixed').checked ? 'fixed' : 'flexible';
    const restStart = document.getElementById('shiftRestStart').value || '12:00';
    const restEnd = document.getElementById('shiftRestEnd').value || '13:00';
    const flexibleMinutes = normalizeRestMinutes(document.getElementById('shiftRestMinutes').value, 60, 480);
    const fixedMinutes = calcTimeRangeMinutes(restStart, restEnd, restEnd <= restStart);
    const restMinutes = hasRest ? (restType === 'fixed' ? (fixedMinutes || flexibleMinutes || 60) : flexibleMinutes) : 0;
    return { hasRest, restType, restStart, restEnd, restMinutes, rest: restMinutes / 60 };
  }

  function applyShiftOvertimeFields(shift = {}) {
    const overtime = normalizeShiftOvertimeSettings(shift);
    document.getElementById('shiftAutoCountOvertime').checked = overtime.autoCountOvertime;
    document.getElementById('shiftCountEarlyArrivalAsOvertime').checked = overtime.countEarlyArrivalAsOvertime;
    document.getElementById('shiftCountLateDepartureAsOvertime').checked = overtime.countLateDepartureAsOvertime;
    document.getElementById('shiftMinOvertimeMinutes').value = overtime.minOvertimeMinutes;
    document.getElementById('shiftMaxOvertimeMinutes').value = overtime.maxOvertimeMinutes;
    document.getElementById('shiftRestBeforeOvertimeMinutes').value = overtime.restBeforeOvertimeMinutes;
    updateShiftOvertimeUI();
  }

  function readShiftOvertimeFields(shiftEnd) {
    const autoCountOvertime = !!document.getElementById('shiftAutoCountOvertime').checked;
    const countEarlyArrivalAsOvertime = !!document.getElementById('shiftCountEarlyArrivalAsOvertime').checked;
    const countLateDepartureAsOvertime = !!document.getElementById('shiftCountLateDepartureAsOvertime').checked;
    const minOvertimeMinutes = normalizeOvertimeMinutes(document.getElementById('shiftMinOvertimeMinutes').value, 30, 720);
    const maxOvertimeMinutes = Math.max(normalizeOvertimeMinutes(document.getElementById('shiftMaxOvertimeMinutes').value, 360, 720), minOvertimeMinutes);
    const restBeforeOvertimeMinutes = normalizeOvertimeMinutes(document.getElementById('shiftRestBeforeOvertimeMinutes').value, 30, 240);
    const useLateWindow = autoCountOvertime && countLateDepartureAsOvertime;
    return {
      autoCountOvertime,
      countEarlyArrivalAsOvertime,
      countLateDepartureAsOvertime,
      minOvertimeMinutes,
      maxOvertimeMinutes,
      restBeforeOvertimeMinutes,
      otStart: useLateWindow ? addMinutesToTime(shiftEnd, minOvertimeMinutes) : '',
      otEnd: useLateWindow ? addMinutesToTime(shiftEnd, maxOvertimeMinutes) : ''
    };
  }

  function updateShiftRestUI() {
    const hasRest = !!document.getElementById('shiftHasRest').checked;
    const isFixed = !!document.getElementById('shiftRestTypeFixed').checked;
    const config = document.getElementById('shiftRestConfig');
    const fixedFields = document.getElementById('shiftRestFixedFields');
    const flexibleFields = document.getElementById('shiftRestFlexibleFields');
    if (config) {
      config.classList.toggle('opacity-50', !hasRest);
      config.classList.toggle('pointer-events-none', !hasRest);
    }
    if (fixedFields) fixedFields.classList.toggle('hidden', !hasRest || !isFixed);
    if (flexibleFields) flexibleFields.classList.toggle('hidden', !hasRest || isFixed);
  }

  function updateShiftOvertimeUI() {
    const autoEnabled = !!document.getElementById('shiftAutoCountOvertime').checked;
    const earlyEnabled = !!document.getElementById('shiftCountEarlyArrivalAsOvertime').checked;
    const lateEnabled = !!document.getElementById('shiftCountLateDepartureAsOvertime').checked;
    const rulesEl = document.getElementById('shiftOvertimeRules');
    const detailEl = document.getElementById('shiftOvertimeDetailFields');
    if (rulesEl) {
      rulesEl.classList.toggle('opacity-50', !autoEnabled);
      rulesEl.classList.toggle('pointer-events-none', !autoEnabled);
    }
    if (detailEl) detailEl.classList.toggle('hidden', !autoEnabled || (!earlyEnabled && !lateEnabled));
  }

  function onShiftTimeChange() {
    const start = document.getElementById('shiftStart').value;
    const end = document.getElementById('shiftEnd').value;
    const crossDay = !!document.getElementById('shiftCrossDay')?.checked;
    const duration = calcDurationHours(start, end, crossDay);
    const minRest = minRequiredRest(duration);
    const currentRest = readShiftRestFields();
    if (currentRest.rest < minRest) {
      document.getElementById('shiftHasRest').checked = minRest > 0;
      if (currentRest.restType === 'fixed') {
        document.getElementById('shiftRestEnd').value = addMinutesToTime(document.getElementById('shiftRestStart').value || '12:00', Math.round(minRest * 60));
      } else {
        document.getElementById('shiftRestMinutes').value = Math.round(minRest * 60);
      }
    }
    updateShiftRestUI();
    updateShiftHoursPreview();
  }

  function updateShiftHoursPreview() {
    const start = document.getElementById('shiftStart').value;
    const end = document.getElementById('shiftEnd').value;
    const crossDay = !!document.getElementById('shiftCrossDay')?.checked;
    const rest = readShiftRestFields().rest;
    const hours = calcWorkHours(start, end, rest, crossDay);
    const minRest = minRequiredRest(calcDurationHours(start, end, crossDay));
    const hoursEl = document.getElementById('shiftHoursPreview');
    const minEl = document.getElementById('shiftMinRest');
    if (hoursEl) hoursEl.textContent = `${hours}h`;
    if (minEl) {
      minEl.textContent = `${minRest}h`;
      minEl.classList.toggle('text-red-600', rest < minRest);
      minEl.classList.toggle('text-orange-700', rest >= minRest);
    }
  }

  function applyShiftFields(shift) {
    document.getElementById('shiftName').value = shift.name || '';
    document.getElementById('shiftShortName').value = shift.shortName || '';
    document.getElementById('shiftStart').value = shift.start || '08:00';
    document.getElementById('shiftEnd').value = shift.end || '12:00';
    const inferredCrossDay = typeof shift.crossDay === 'boolean' ? shift.crossDay : ((shift.start || '') && (shift.end || '') && (shift.end < shift.start));
    document.getElementById('shiftCrossDay').checked = !!inferredCrossDay;
    applyShiftRestFields(shift);
    applyShiftOvertimeFields(shift);
    document.getElementById('shiftPunchBeforeMinutes').value = normalizePunchWindowMinutes(shift.punchBeforeMinutes, 30, PUNCH_BEFORE_MAX_MINUTES);
    document.getElementById('shiftPunchAfterMinutes').value = normalizePunchWindowMinutes(shift.punchAfterMinutes, 30, PUNCH_AFTER_MAX_MINUTES);
    updateShiftHoursPreview();
  }

  function initPage() {
    const isEdit = editingShiftIndex >= 0 && !!shifts[editingShiftIndex];
    document.getElementById('pageTitle').textContent = isEdit ? `編輯班別：${shifts[editingShiftIndex].name || ''}` : '新增班別';
    document.getElementById('saveBtn').textContent = isEdit ? '更新' : '儲存';
    renderScopeSelectors(isEdit ? shifts[editingShiftIndex] : null);
    if (isEdit) {
      applyShiftFields(shifts[editingShiftIndex]);
    } else {
      applyShiftFields({
        start: '08:00',
        end: '12:00',
        crossDay: false,
        hasRest: false,
        restType: 'fixed',
        restStart: '12:00',
        restEnd: '13:00',
        restMinutes: 60,
        rest: 0,
        autoCountOvertime: true,
        countEarlyArrivalAsOvertime: false,
        countLateDepartureAsOvertime: true,
        minOvertimeMinutes: 30,
        maxOvertimeMinutes: 360,
        restBeforeOvertimeMinutes: 30,
        punchBeforeMinutes: 30,
        punchAfterMinutes: 30
      });
    }
    lucide.createIcons();
  }

  function saveShift() {
    const name = document.getElementById('shiftName').value.trim();
    const shortName = document.getElementById('shiftShortName').value.trim();
    const start = document.getElementById('shiftStart').value;
    const end = document.getElementById('shiftEnd').value;
    const crossDay = !!document.getElementById('shiftCrossDay').checked;
    const restConfig = readShiftRestFields();
    const overtime = readShiftOvertimeFields(end);
    const punchBeforeMinutes = normalizePunchWindowMinutes(document.getElementById('shiftPunchBeforeMinutes').value, 30, PUNCH_BEFORE_MAX_MINUTES);
    const punchAfterMinutes = normalizePunchWindowMinutes(document.getElementById('shiftPunchAfterMinutes').value, 30, PUNCH_AFTER_MAX_MINUTES);
    const duration = calcDurationHours(start, end, crossDay);
    const hours = calcWorkHours(start, end, restConfig.rest, crossDay);

    if (!name) { alert('請輸入班別名稱'); return; }
    if (!shortName) { alert('請輸入班別簡稱'); return; }
    if (crossDay && start === end) { alert('跨天班別的起始與結束時間不可相同'); return; }
    if (duration <= 0) { alert('結束時間必須晚於起始時間；若為跨天班別請勾選「允許跨天」'); return; }
    if (restConfig.rest < 0) { alert('休息時數不可為負數'); return; }
    const minRest = minRequiredRest(duration);
    if (restConfig.rest < minRest) { alert(`依勞基法，此時段至少需休息 ${minRest}h（現設 ${restConfig.rest}h）。`); return; }
    if (hours <= 0) { alert('總工時 = 結束-起始-休息，請調整使總工時大於 0'); return; }

    const existing = editingShiftIndex >= 0 && shifts[editingShiftIndex] ? shifts[editingShiftIndex] : null;
    const scopeFields = buildScopeFields(existing);
    const payload = { name, shortName, start, end, crossDay, hours, ...restConfig, ...overtime, punchBeforeMinutes, punchAfterMinutes, ...scopeFields };

    if (editingShiftIndex >= 0 && shifts[editingShiftIndex]) {
      const oldName = shifts[editingShiftIndex].name;
      shifts[editingShiftIndex] = payload;
      if (oldName !== name) {
        attendanceGroups.forEach((g) => {
          if (!g.weekdayShifts) return;
          Object.keys(g.weekdayShifts).forEach((k) => {
            const arr = g.weekdayShifts[k];
            if (Array.isArray(arr)) g.weekdayShifts[k] = arr.map((n) => n === oldName ? name : n);
          });
        });
      }
    } else {
      shifts.push(payload);
    }

    persistAndBack();
  }

  function persistAndBack() {
    if (source === 'new') {
      const nextDraft = Object.assign({}, draft || {}, { shifts, attendanceGroups });
      localStorage.setItem(DRAFT_KEY, JSON.stringify(nextDraft));
    } else if (mode === 'library') {
      chooseLibrary.shifts = shifts;
      chooseLibrary.attendanceGroups = attendanceGroups;
      localStorage.setItem(CHOOSE_LIBRARY_KEY, JSON.stringify(chooseLibrary));
    } else {
      sched.shifts = shifts;
      sched.attendanceGroups = attendanceGroups;
      schedules[currentScheduleIndex] = sched;
      G.schedules = schedules;
      localStorage.setItem('shiftMgmt:global', JSON.stringify(G));
    }
    goBack();
  }

  function goBack() {
     const target = returnTo || (source === 'new' ? 'shift-setting-new.html' : 'shift-setting.html');
     const url = new URL(target, window.location.origin);
     if (source === 'new') {
       url.searchParams.set('index', '-1');
     } else {
       url.searchParams.set('index', String(currentScheduleIndex));
     }
     window.location.href = `${url.pathname}${url.search}`;
  }

  window.saveShift = saveShift;
  window.goBack = goBack;
  window.onShiftTimeChange = onShiftTimeChange;
  window.updateShiftHoursPreview = updateShiftHoursPreview;
  window.updateShiftRestUI = updateShiftRestUI;
  window.updateShiftOvertimeUI = updateShiftOvertimeUI;

  initPage();
  </script>
 </body>
</html>
