<!doctype html>
<html lang="zh-TW" class="h-full">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>假別組設定</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
  <style>
    * { font-family: 'Noto Sans TC', sans-serif; }
    html, body { height: 100%; width: 100%; }
    .tag-item { display: inline-flex; align-items: center; gap: 6px; background: #fee2e2; color: #b91c1c; padding: 4px 10px; border-radius: 4px; font-size: 13px; margin: 3px; }
  </style>
 </head>
 <body class="h-full bg-slate-50 w-full">
  <div class="h-full w-full flex flex-col overflow-auto">
   <header class="bg-[#1e3a5f] text-white px-6 py-4 flex items-center justify-between shrink-0">
    <h1 id="pageTitle" class="text-xl font-bold tracking-wide">新增假別組</h1>
    <button onclick="goBack()" class="px-4 py-1.5 rounded-md text-sm font-medium transition hover:bg-white/10">返回班表設定</button>
   </header>

   <main class="flex-1 overflow-auto p-6">
    <div class="max-w-3xl mx-auto">
      <section class="bg-white rounded-xl shadow-sm p-5 space-y-4">
        <h2 class="font-bold text-lg text-slate-800 flex items-center gap-2"><i data-lucide="calendar-off" class="w-5 h-5 text-red-500"></i>假別組資訊</h2>

        <div>
          <label class="block text-sm font-medium text-slate-600 mb-1">假別組名稱</label>
          <input type="text" id="holidayGroupName" placeholder="如：台灣國定假日" class="w-full border border-slate-300 rounded-md px-3 py-2 text-sm">
        </div>

        <div id="scopeSelectorWrap" class="grid grid-cols-1 md:grid-cols-2 gap-3">
          <div>
            <label class="block text-sm font-medium text-slate-600 mb-1">分公司/分店/案場</label>
            <select id="scopeBranchSelect" class="w-full border border-slate-300 rounded-md px-3 py-2 text-sm"></select>
          </div>
          <div>
            <label class="block text-sm font-medium text-slate-600 mb-1">部門/工作地</label>
            <select id="scopeDepartmentSelect" class="w-full border border-slate-300 rounded-md px-3 py-2 text-sm"></select>
          </div>
        </div>

        <div>
          <label class="block text-sm font-medium text-slate-600 mb-2">假日日期</label>
          <div class="flex gap-2 mb-2">
            <input type="date" id="addHolidayDateInput" class="flex-1 border border-slate-300 rounded-md px-3 py-2 text-sm">
            <button onclick="addHolidayDate()" class="px-3 py-1.5 bg-red-50 text-red-600 rounded-md text-sm font-medium hover:bg-red-100 transition">新增</button>
          </div>
          <div id="holidayDateList" class="flex flex-wrap gap-1 bg-slate-50 border border-slate-200 rounded-md p-2 min-h-[44px]"></div>
        </div>

        <div class="flex justify-end gap-2 pt-2">
          <button onclick="goBack()" class="px-4 py-2 text-sm text-slate-600 hover:bg-slate-100 rounded-md">取消</button>
          <button onclick="saveHolidayGroup()" class="px-4 py-2 text-sm bg-[#1e3a5f] text-white rounded-md hover:bg-[#2a4f7f]">儲存</button>
        </div>
      </section>
    </div>
   </main>
  </div>

  <script>
  const CHOOSE_LIBRARY_KEY = 'shiftMgmt:chooseLibrary';
  const FALLBACK = {
    schedules: [
      {
        holidayGroups: {
          '台灣國定假日': ['2026-01-01']
        },
        selectedHolidayGroups: ['台灣國定假日']
      }
    ]
  };

  let G = FALLBACK;
  try {
    const raw = localStorage.getItem('shiftMgmt:global');
    if (raw) G = Object.assign({}, FALLBACK, JSON.parse(raw));
  } catch (e) { console.warn('load global failed', e); }

  const DRAFT_KEY = 'shiftMgmt:newScheduleDraft';
  const params = new URLSearchParams(location.search);
  const source = params.get('source') || 'edit';
  const mode = params.get('mode') === 'library' ? 'library' : 'schedule';
  const returnTo = params.get('returnTo') || '';
  let currentScheduleIndex = parseInt(params.get('index'), 10);
  if (Number.isNaN(currentScheduleIndex)) currentScheduleIndex = 0;
  const editingGroupName = params.get('groupName') || '';

  let schedules = Array.isArray(G.schedules) && G.schedules.length ? G.schedules : FALLBACK.schedules;
  if (currentScheduleIndex < 0 || currentScheduleIndex >= schedules.length) currentScheduleIndex = 0;

  let draft = null;
  let chooseLibrary = { holidayGroups: {}, selectedHolidayGroups: [], holidayGroupMeta: {} };
  if (source === 'new') {
    try {
      const rawDraft = localStorage.getItem(DRAFT_KEY);
      if (rawDraft) draft = JSON.parse(rawDraft);
    } catch (e) { console.warn('load draft failed', e); }
  } else if (mode === 'library') {
    try {
      const rawLibrary = localStorage.getItem(CHOOSE_LIBRARY_KEY);
      if (rawLibrary) {
        chooseLibrary = Object.assign({}, chooseLibrary, JSON.parse(rawLibrary));
      } else {
        chooseLibrary = {
          holidayGroups: (G.holidayGroups && typeof G.holidayGroups === 'object') ? { ...G.holidayGroups } : {},
          selectedHolidayGroups: Array.isArray(G.selectedHolidayGroups) ? [...G.selectedHolidayGroups] : [],
          holidayGroupMeta: (G.holidayGroupMeta && typeof G.holidayGroupMeta === 'object') ? { ...G.holidayGroupMeta } : {}
        };
      }
    } catch (e) {
      console.warn('load choose library failed', e);
    }
  }

  const sched = source === 'new'
    ? (draft || { holidayGroups: G.holidayGroups || {}, selectedHolidayGroups: G.selectedHolidayGroups || [] })
    : (mode === 'library'
      ? { holidayGroups: chooseLibrary.holidayGroups || {}, selectedHolidayGroups: chooseLibrary.selectedHolidayGroups || [] }
      : (schedules[currentScheduleIndex] || FALLBACK.schedules[0]));
  let holidayGroups = (sched.holidayGroups && typeof sched.holidayGroups === 'object') ? { ...sched.holidayGroups } : {};
  let selectedHolidayGroups = Array.isArray(sched.selectedHolidayGroups) ? [...sched.selectedHolidayGroups] : [];
  let holidayGroupMeta = (sched.holidayGroupMeta && typeof sched.holidayGroupMeta === 'object') ? { ...sched.holidayGroupMeta } : {};
  let editingHolidayDates = [];

  function splitScopeValues(raw) {
    return String(raw || '')
      .split(/[\/,，、；;｜|\s]+/)
      .map(v => v.trim())
      .filter(Boolean);
  }

  function pickScopeArray(existing, fallbackRaw) {
    if (Array.isArray(existing) && existing.length) {
      return Array.from(new Set(existing.map(v => String(v || '').trim()).filter(Boolean)));
    }
    return Array.from(new Set(splitScopeValues(fallbackRaw)));
  }

  function buildScopeOptions(globalList, scheduleRaw, existingRaw) {
    const all = new Set();
    if (Array.isArray(globalList)) {
      globalList.forEach(item => splitScopeValues(item).forEach(v => all.add(v)));
    }
    splitScopeValues(scheduleRaw).forEach(v => all.add(v));
    splitScopeValues(existingRaw).forEach(v => all.add(v));
    return Array.from(all).filter(Boolean).sort((a, b) => a.localeCompare(b, 'zh-Hant'));
  }

  function renderScopeSelectors(existing = null) {
    const branchSelect = document.getElementById('scopeBranchSelect');
    const departmentSelect = document.getElementById('scopeDepartmentSelect');
    if (!branchSelect || !departmentSelect) return;

    const scheduleBranch = sched && sched.branch ? sched.branch : '';
    const scheduleDepartment = sched && sched.department ? sched.department : '';
    const currentBranch = existing && existing.branch ? existing.branch : '';
    const currentDepartment = existing && existing.department ? existing.department : '';

    const branchOptions = buildScopeOptions(G.branches, scheduleBranch, currentBranch);
    const departmentOptions = buildScopeOptions(G.departments, scheduleDepartment, currentDepartment);

    branchSelect.innerHTML = `<option value="">未指定</option>` + branchOptions.map(v => `<option value="${v}">${v}</option>`).join('');
    departmentSelect.innerHTML = `<option value="">未指定</option>` + departmentOptions.map(v => `<option value="${v}">${v}</option>`).join('');
    branchSelect.value = currentBranch;
    departmentSelect.value = currentDepartment;
    if (branchSelect.value !== currentBranch) branchSelect.value = '';
    if (departmentSelect.value !== currentDepartment) departmentSelect.value = '';
  }

  function buildScopeFields(existing = null) {
    const scheduleBranch = sched && sched.branch ? sched.branch : '';
    const scheduleDepartment = sched && sched.department ? sched.department : '';
    const selectedBranch = (document.getElementById('scopeBranchSelect')?.value || '').trim();
    const selectedDepartment = (document.getElementById('scopeDepartmentSelect')?.value || '').trim();
    const hasScopeInputs = !!document.getElementById('scopeBranchSelect') && !!document.getElementById('scopeDepartmentSelect');
    const branches = hasScopeInputs
      ? (selectedBranch ? [selectedBranch] : [])
      : pickScopeArray(existing && existing.branches, existing && existing.branch ? existing.branch : scheduleBranch);
    const departments = hasScopeInputs
      ? (selectedDepartment ? [selectedDepartment] : [])
      : pickScopeArray(existing && existing.departments, existing && existing.department ? existing.department : scheduleDepartment);
    return {
      branch: branches[0] || '',
      branches,
      department: departments[0] || '',
      departments
    };
  }

  function initPage() {
    const isEdit = !!editingGroupName && !!holidayGroups[editingGroupName];
    document.getElementById('pageTitle').textContent = isEdit ? '編輯假別組' : '新增假別組';
    const scopeWrap = document.getElementById('scopeSelectorWrap');
    if (scopeWrap) scopeWrap.style.display = mode === 'library' ? 'grid' : 'none';
    const currentMeta = isEdit ? (holidayGroupMeta[editingGroupName] || null) : null;
    renderScopeSelectors(currentMeta);

    if (isEdit) {
      document.getElementById('holidayGroupName').value = editingGroupName;
      editingHolidayDates = Array.isArray(holidayGroups[editingGroupName]) ? [...holidayGroups[editingGroupName]] : [];
      editingHolidayDates.sort();
    }

    renderHolidayDateList();
    lucide.createIcons();
  }

  function addHolidayDate() {
    const date = document.getElementById('addHolidayDateInput').value;
    if (!date) return;
    if (!editingHolidayDates.includes(date)) {
      editingHolidayDates.push(date);
      editingHolidayDates.sort();
      renderHolidayDateList();
    }
    document.getElementById('addHolidayDateInput').value = '';
  }

  function removeHolidayDate(index) {
    if (index < 0 || index >= editingHolidayDates.length) return;
    editingHolidayDates.splice(index, 1);
    renderHolidayDateList();
  }

  function renderHolidayDateList() {
    const container = document.getElementById('holidayDateList');
    if (!editingHolidayDates.length) {
      container.innerHTML = '<div class="text-sm text-slate-500 py-1">尚未新增假日日期</div>';
      return;
    }
    container.innerHTML = editingHolidayDates.map((date, idx) =>
      `<span class="tag-item">${date}<button onclick="removeHolidayDate(${idx})" class="ml-1 text-red-400 hover:text-red-600">×</button></span>`
    ).join('');
  }

  function saveHolidayGroup() {
    const groupName = document.getElementById('holidayGroupName').value.trim();
    if (!groupName) {
      alert('請輸入假別組名稱');
      return;
    }
    if (editingHolidayDates.length === 0) {
      alert('請至少新增一個假日日期');
      return;
    }

    const oldName = editingGroupName;
    const isRename = !!oldName && oldName !== groupName && !!holidayGroups[oldName];
    const oldScopeMeta = (oldName && holidayGroupMeta && holidayGroupMeta[oldName]) ? holidayGroupMeta[oldName] : null;

    if (isRename) {
      delete holidayGroups[oldName];
      delete holidayGroupMeta[oldName];
      const selectedIdx = selectedHolidayGroups.indexOf(oldName);
      if (selectedIdx > -1) selectedHolidayGroups[selectedIdx] = groupName;
    }

    holidayGroups[groupName] = [...editingHolidayDates];
    holidayGroupMeta[groupName] = buildScopeFields(oldScopeMeta);
    if (source === 'new') {
      const nextDraft = Object.assign({}, draft || {}, {
        holidayGroups,
        selectedHolidayGroups,
        holidayGroupMeta
      });
      localStorage.setItem(DRAFT_KEY, JSON.stringify(nextDraft));
    } else if (mode === 'library') {
      chooseLibrary.holidayGroups = holidayGroups;
      chooseLibrary.selectedHolidayGroups = selectedHolidayGroups;
      chooseLibrary.holidayGroupMeta = holidayGroupMeta;
      localStorage.setItem(CHOOSE_LIBRARY_KEY, JSON.stringify(chooseLibrary));
    } else {
      sched.holidayGroups = holidayGroups;
      sched.selectedHolidayGroups = selectedHolidayGroups;
      sched.holidayGroupMeta = holidayGroupMeta;

      schedules[currentScheduleIndex] = sched;
      G.schedules = schedules;
      localStorage.setItem('shiftMgmt:global', JSON.stringify(G));
    }
    goBack();
  }

  function goBack() {
    const target = returnTo || (source === 'new' ? 'shift-setting-new.html' : 'shift-setting.html');
    const url = new URL(target, window.location.origin);
    if (source === 'new') {
      url.searchParams.set('index', '-1');
    } else {
      url.searchParams.set('index', String(currentScheduleIndex));
    }
    window.location.href = `${url.pathname}${url.search}`;
  }

  window.addHolidayDate = addHolidayDate;
  window.removeHolidayDate = removeHolidayDate;
  window.saveHolidayGroup = saveHolidayGroup;
  window.goBack = goBack;
  initPage();
  </script>
 </body>
</html>
